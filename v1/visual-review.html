<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liminal 素材・全マップ確認</title>
<style>body{margin:0;background:#141713;color:#e8e9e0;font:13px system-ui}header{padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input{background:#272e25;color:inherit;border:1px solid #63705c;padding:7px}canvas{display:block;width:1280px;height:720px;max-width:none}input{width:76px}pre{white-space:pre-wrap;margin:12px;max-height:20vh;overflow:auto}#status{margin:8px 12px}label{display:flex;gap:5px;align-items:center}</style>
<header><strong>全マップ 素材確認</strong><label>部屋<select id="room"></select></label><label>視点<select id="view"><option value="entry">入口</option><option value="center">室内</option><option value="reverse">逆方向</option><option value="detail">素材近接</option></select></label><label>品質<select id="tier"><option>high</option><option>mid</option><option>low</option></select></label><label>seed<input id="seed" type="number" value="42" min="0"></label><label>variant<input id="variant" type="number" value="0" min="0"></label><label>露出<input id="exposure" type="number" value="1.25" min="0.1" max="4" step="0.05"></label><label>診断<select id="diagnostic"><option value="beauty">通常</option><option value="albedo">カラーのみ</option><option value="roughness">粗さ</option><option value="normal">法線</option><option value="baked">静的照明</option><option value="direct">動的光</option></select></label><button id="save-before">変更前を記録</button><button id="save-after">変更後を記録</button><button id="measure">120フレーム計測</button><button id="doors">扉を開閉</button><button id="audit">全定義を検査</button><a id="download" hidden>結果を保存</a></header>
<canvas id="review"></canvas><p id="status">テクスチャ読込中</p><pre id="capture"></pre><pre id="report"></pre><script type="module" src="/src/dev/VisualReview.ts"></script></html>
